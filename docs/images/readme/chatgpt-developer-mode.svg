<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Register and link an MCP app</title><desc id="desc">Four account-gated steps: open Apps Management, register the MCP app, copy the real app ID, and link it locally.</desc><rect width="1200" height="430" rx="24" fill="#F8FAFC"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="60" fill="#0B1020" font-size="28" font-weight="750">MCP Apps: registration is a human, account-gated step</text><g text-anchor="middle"><g transform="translate(45 115)"><rect width="250" height="205" rx="18" fill="#0B1020"/><circle cx="125" cy="52" r="25" fill="#2DD4BF"/><text x="125" y="60" fill="#0B1020" font-size="22" font-weight="800">1</text><text x="125" y="105" fill="#F8FAFC" font-size="18" font-weight="700">Open Apps Management</text><text x="125" y="139" fill="#CBD5E1" font-size="14">Use the submitting</text><text x="125" y="162" fill="#CBD5E1" font-size="14">ChatGPT workspace</text></g><g transform="translate(330 115)"><rect width="250" height="205" rx="18" fill="#0B1020"/><circle cx="125" cy="52" r="25" fill="#2DD4BF"/><text x="125" y="60" fill="#0B1020" font-size="22" font-weight="800">2</text><text x="125" y="105" fill="#F8FAFC" font-size="18" font-weight="700">Register the MCP app</text><text x="125" y="139" fill="#CBD5E1" font-size="14">Review endpoint, tools,</text><text x="125" y="162" fill="#CBD5E1" font-size="14">permissions, and CSP</text></g><g transform="translate(615 115)"><rect width="250" height="205" rx="18" fill="#0B1020"/><circle cx="125" cy="52" r="25" fill="#8B5CF6"/><text x="125" y="60" fill="#F8FAFC" font-size="22" font-weight="800">3</text><text x="125" y="105" fill="#F8FAFC" font-size="18" font-weight="700">Copy the real app ID</text><text x="125" y="147" fill="#C4B5FD" font-family="ui-monospace,monospace" font-size="13">plugin_asdk_app…</text></g><g transform="translate(900 115)"><rect width="250" height="205" rx="18" fill="#0B1020"/><circle cx="125" cy="52" r="25" fill="#8B5CF6"/><text x="125" y="60" fill="#F8FAFC" font-size="22" font-weight="800">4</text><text x="125" y="105" fill="#F8FAFC" font-size="18" font-weight="700">Link locally</text><text x="125" y="143" fill="#C4B5FD" font-family="ui-monospace,monospace" font-size="13">chatgpt-spawn</text><text x="125" y="166" fill="#C4B5FD" font-family="ui-monospace,monospace" font-size="13">link-app … --id …</text></g></g><text x="600" y="379" fill="#92400E" font-size="15" text-anchor="middle">Procedure diagram — not a screenshot of an authenticated account</text></g></svg>
