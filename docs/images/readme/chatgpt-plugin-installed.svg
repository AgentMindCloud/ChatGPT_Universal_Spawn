<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Verify a locally installed plugin</title><desc id="desc">Checklist to verify the plugin name, marketplace, capability labels, and starter prompts after installation.</desc><rect width="1200" height="390" rx="24" fill="#0B1020"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="60" fill="#F8FAFC" font-size="28" font-weight="750">After installation: verify what ChatGPT or Codex actually loaded</text><g transform="translate(65 105)"><rect width="1070" height="205" rx="18" fill="#13203A" stroke="#334155" stroke-width="2"/><g font-size="18"><circle cx="55" cy="47" r="14" fill="#2DD4BF"/><path d="m48 47 5 5 10-12" fill="none" stroke="#0B1020" stroke-width="4"/><text x="88" y="54" fill="#F8FAFC">The displayed name is <tspan font-weight="700">Meeting Follow-up</tspan>.</text><circle cx="55" cy="91" r="14" fill="#2DD4BF"/><path d="m48 91 5 5 10-12" fill="none" stroke="#0B1020" stroke-width="4"/><text x="88" y="98" fill="#F8FAFC">The source is the intended personal or repository marketplace.</text><circle cx="55" cy="135" r="14" fill="#2DD4BF"/><path d="m48 135 5 5 10-12" fill="none" stroke="#0B1020" stroke-width="4"/><text x="88" y="142" fill="#F8FAFC">Capabilities and authentication timing match the preview.</text><circle cx="55" cy="179" r="14" fill="#2DD4BF"/><path d="m48 179 5 5 10-12" fill="none" stroke="#0B1020" stroke-width="4"/><text x="88" y="186" fill="#F8FAFC">Starter prompts describe the same released workflow.</text></g></g><text x="600" y="352" fill="#FDE68A" font-size="15" text-anchor="middle">UI labels can change; verify meaning, not pixel position</text></g></svg>
