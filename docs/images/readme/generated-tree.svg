<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Generated plugin folder</title><desc id="desc">Annotated file tree showing the canonical plugin manifest, skill, agent metadata, and submission preflight.</desc><rect width="1200" height="570" rx="24" fill="#0B1020"/><g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="19"><text x="60" y="58" fill="#F8FAFC" font-family="Inter,system-ui,sans-serif" font-size="27" font-weight="750">What `init` creates</text><g fill="#CBD5E1"><text x="65" y="112">meeting-follow-up/</text><text x="95" y="157">├── .codex-plugin/</text><text x="125" y="198">│   └── plugin.json</text><text x="95" y="243">├── skills/</text><text x="125" y="284">│   └── meeting-follow-up/</text><text x="155" y="325">│       ├── SKILL.md</text><text x="155" y="366">│       └── agents/openai.yaml</text><text x="95" y="411">└── submission/</text><text x="125" y="452">    └── chatgpt-submission.yaml</text></g><g font-family="Inter,system-ui,sans-serif"><path d="M520 190h90" stroke="#2DD4BF" stroke-width="3"/><circle cx="520" cy="190" r="6" fill="#2DD4BF"/><text x="635" y="180" fill="#99F6E4" font-size="18" font-weight="700">Canonical package manifest</text><text x="635" y="207" fill="#CBD5E1" font-size="15">Name, version, surfaces, assets, and capabilities</text><path d="M520 316h90" stroke="#8B5CF6" stroke-width="3"/><circle cx="520" cy="316" r="6" fill="#8B5CF6"/><text x="635" y="306" fill="#C4B5FD" font-size="18" font-weight="700">The actual workflow</text><text x="635" y="333" fill="#CBD5E1" font-size="15">Focused trigger plus plain-language instructions</text><path d="M520 444h90" stroke="#F59E0B" stroke-width="3"/><circle cx="520" cy="444" r="6" fill="#F59E0B"/><text x="635" y="434" fill="#FDE68A" font-size="18" font-weight="700">Publish preflight only</text><text x="635" y="461" fill="#CBD5E1" font-size="15">Test cases and human attestations; excluded from ZIP</text></g><rect x="60" y="500" width="1080" height="42" rx="10" fill="#13203A"/><text x="600" y="527" fill="#F8FAFC" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="15">No secret values · no dependency tree · no alternate manifest</text></g></svg>
