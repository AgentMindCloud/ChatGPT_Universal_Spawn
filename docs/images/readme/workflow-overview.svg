<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc"><title id="title">Plugin workflow overview</title><desc id="desc">Five steps: create, validate, build, install, and use, with a manual confirmation before installation.</desc><rect width="1200" height="280" rx="24" fill="#0B1020"/><g font-family="Inter,system-ui,sans-serif"><text x="52" y="55" fill="#F8FAFC" font-size="27" font-weight="700">From idea to a usable local plugin</text><g font-size="20" font-weight="700" text-anchor="middle"><rect x="50" y="105" width="180" height="92" rx="16" fill="#13203A" stroke="#2DD4BF" stroke-width="3"/><text x="140" y="145" fill="#99F6E4">1 · CREATE</text><text x="140" y="175" fill="#CBD5E1" font-size="15" font-weight="500">Choose one template</text><rect x="280" y="105" width="180" height="92" rx="16" fill="#13203A" stroke="#2DD4BF" stroke-width="3"/><text x="370" y="145" fill="#99F6E4">2 · VALIDATE</text><text x="370" y="175" fill="#CBD5E1" font-size="15" font-weight="500">Fail on unsafe input</text><rect x="510" y="105" width="180" height="92" rx="16" fill="#13203A" stroke="#8B5CF6" stroke-width="3"/><text x="600" y="145" fill="#C4B5FD">3 · BUILD</text><text x="600" y="175" fill="#CBD5E1" font-size="15" font-weight="500">ZIP + SHA-256</text><rect x="740" y="105" width="180" height="92" rx="16" fill="#13203A" stroke="#F8FAFC" stroke-width="3"/><text x="830" y="145" fill="#F8FAFC">4 · INSTALL</text><text x="830" y="175" fill="#CBD5E1" font-size="15" font-weight="500">Preview, then confirm</text><rect x="970" y="105" width="180" height="92" rx="16" fill="#13203A" stroke="#2DD4BF" stroke-width="3"/><text x="1060" y="145" fill="#99F6E4">5 · USE</text><text x="1060" y="175" fill="#CBD5E1" font-size="15" font-weight="500">ChatGPT Work</text></g><g fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"><path d="M230 151h42"/><path d="m264 143 8 8-8 8"/><path d="M460 151h42"/><path d="m494 143 8 8-8 8"/><path d="M690 151h42"/><path d="m724 143 8 8-8 8"/><path d="M920 151h42"/><path d="m954 143 8 8-8 8"/></g><text x="830" y="230" fill="#FDE68A" font-size="14" text-anchor="middle">Human confirmation boundary</text></g></svg>
