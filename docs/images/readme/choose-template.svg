<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Choose a plugin template</title><desc id="desc">Decision diagram choosing skill, MCP, MCP UI, or Custom GPT Action based on whether a new tool, interactive UI, or manual GPT editor bundle is needed.</desc><rect width="1200" height="520" rx="24" fill="#F8FAFC"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="58" fill="#0B1020" font-size="28" font-weight="750">Choose the smallest template that solves the job</text><rect x="430" y="90" width="340" height="62" rx="15" fill="#0B1020"/><text x="600" y="128" fill="#F8FAFC" font-size="19" font-weight="700" text-anchor="middle">Does ChatGPT need a new tool?</text><path d="M600 152v60M600 212H250v52M600 212h350v52" fill="none" stroke="#64748B" stroke-width="3"/><text x="300" y="202" fill="#0F766E" font-size="15" font-weight="700">NO</text><text x="900" y="202" fill="#6D28D9" font-size="15" font-weight="700">YES</text><rect x="80" y="264" width="340" height="118" rx="18" fill="#CCFBF1" stroke="#2DD4BF" stroke-width="3"/><text x="250" y="307" fill="#0B1020" font-size="24" font-weight="750" text-anchor="middle">skill</text><text x="250" y="339" fill="#334155" font-size="16" text-anchor="middle">Instructions and repeatable workflows</text><text x="250" y="364" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">Recommended starting point</text><rect x="780" y="264" width="340" height="62" rx="15" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3"/><text x="950" y="302" fill="#0B1020" font-size="19" font-weight="700" text-anchor="middle">Does it need interactive UI?</text><path d="M950 326v50M950 376H720v42M950 376h230v42" fill="none" stroke="#64748B" stroke-width="3"/><text x="760" y="367" fill="#0F766E" font-size="14" font-weight="700">NO</text><text x="1120" y="367" fill="#6D28D9" font-size="14" font-weight="700">YES</text><rect x="590" y="418" width="260" height="76" rx="16" fill="#CCFBF1" stroke="#2DD4BF" stroke-width="3"/><text x="720" y="453" fill="#0B1020" font-size="22" font-weight="750" text-anchor="middle">mcp</text><text x="720" y="478" fill="#334155" font-size="14" text-anchor="middle">Callable tools</text><rect x="1050" y="418" width="130" height="76" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="3"/><text x="1115" y="453" fill="#0B1020" font-size="20" font-weight="750" text-anchor="middle">mcp-ui</text><text x="1115" y="478" fill="#334155" font-size="13" text-anchor="middle">Tools + UI</text><rect x="80" y="413" width="340" height="81" rx="16" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><text x="250" y="447" fill="#0B1020" font-size="18" font-weight="700" text-anchor="middle">Using the manual GPT editor?</text><text x="250" y="475" fill="#92400E" font-size="15" font-weight="700" text-anchor="middle">custom-gpt-action</text></g></svg>
