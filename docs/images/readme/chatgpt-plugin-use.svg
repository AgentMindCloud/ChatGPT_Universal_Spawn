<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Test the Meeting Follow-up plugin</title><desc id="desc">A source-grounded test: provide meeting notes, invoke Meeting Follow-up, and check that missing owners are labeled rather than invented.</desc><rect width="1200" height="400" rx="24" fill="#F8FAFC"/><g font-family="Inter,system-ui,sans-serif"><text x="55" y="58" fill="#0B1020" font-size="28" font-weight="750">Canonical smoke test: prove grounding, not just activation</text><g transform="translate(55 100)"><rect width="320" height="210" rx="18" fill="#0B1020"/><text x="25" y="43" fill="#99F6E4" font-size="16" font-weight="700">1 · PROVIDE NOTES</text><text x="25" y="82" fill="#F8FAFC" font-size="16">“Decision: ship Friday.</text><text x="25" y="110" fill="#F8FAFC" font-size="16">Alex owns release notes.</text><text x="25" y="138" fill="#F8FAFC" font-size="16">Security follow-up has</text><text x="25" y="166" fill="#F8FAFC" font-size="16">no owner.”</text></g><path d="M390 205h70m-12-12 12 12-12 12" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(485 100)"><rect width="300" height="210" rx="18" fill="#EDE9FE"/><text x="25" y="43" fill="#6D28D9" font-size="16" font-weight="700">2 · INVOKE</text><text x="25" y="85" fill="#0B1020" font-size="17">“Use Meeting Follow-up</text><text x="25" y="115" fill="#0B1020" font-size="17">to create a recap and</text><text x="25" y="145" fill="#0B1020" font-size="17">action list.”</text></g><path d="M800 205h70m-12-12 12 12-12 12" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(895 100)"><rect width="250" height="210" rx="18" fill="#CCFBF1"/><text x="25" y="43" fill="#0F766E" font-size="16" font-weight="700">3 · VERIFY</text><text x="25" y="82" fill="#0B1020" font-size="15">✓ Friday is preserved</text><text x="25" y="116" fill="#0B1020" font-size="15">✓ Alex owns release notes</text><text x="25" y="150" fill="#0B1020" font-size="15">✓ Follow-up is Unassigned</text><text x="25" y="184" fill="#0B1020" font-size="15">✓ Nothing was sent</text></g></g><text x="600" y="365" fill="#92400E" font-size="15" text-anchor="middle">Procedure diagram — expected behavior comes from the released skill</text></svg>
